<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div class="toolbar-group">
        <label for="model-select" class="visually-hidden">Vybrat model</label>
        <select id="model-select">
          <option value="">— Vyberte model —</option>
        </select>
      </div>
      <div class="toolbar-group">
        <button id="reset-btn" type="button" title="Vrátit pohled na výchozí">Reset view</button>
        <button id="settings-btn" type="button" aria-expanded="true" aria-controls="settings-panel">Světlo a textury</button>
      </div>
      <div class="toolbar-group toolbar-status">
        <span id="status-text"></span>
      </div>
    </header>

    <main id="viewer-container">
      <canvas id="viewer-canvas"></canvas>

      <div id="dropzone" class="dropzone">
        <div class="dropzone-content">
          <p class="dropzone-title">3D Viewer</p>
          <p>Zvolte model ze seznamu vlevo nahoře.</p>
        </div>
      </div>

      <aside id="settings-panel" class="settings-panel">
        <h2>Zobrazení</h2>
        <div class="setting-radio-group" role="radiogroup" aria-label="Režim zobrazení">
          <label class="setting-radio">
            <input type="radio" name="displayMode" data-setting="displayMode" value="solid" />
            <span>Materiály</span>
          </label>
          <label class="setting-radio">
            <input type="radio" name="displayMode" data-setting="displayMode" value="edges" />
            <span>Materiály + hrany</span>
          </label>
          <label class="setting-radio">
            <input type="radio" name="displayMode" data-setting="displayMode" value="wireframe" />
            <span>Drátěný model</span>
          </label>
        </div>

        <h2>Světlo</h2>
        <label class="setting">
          <span>Slunce – síla <output data-for="sunIntensity"></output></span>
          <input type="range" data-setting="sunIntensity" min="0" max="5" step="0.05" />
        </label>
        <label class="setting">
          <span>Slunce – směr <output data-for="sunAzimuth"></output></span>
          <input type="range" data-setting="sunAzimuth" min="0" max="360" step="1" />
        </label>
        <label class="setting">
          <span>Slunce – výška <output data-for="sunElevation"></output></span>
          <input type="range" data-setting="sunElevation" min="5" max="90" step="1" />
        </label>
        <label class="setting">
          <span>Okolní světlo <output data-for="envIntensity"></output></span>
          <input type="range" data-setting="envIntensity" min="0" max="2" step="0.05" />
        </label>
        <label class="setting">
          <span>Expozice <output data-for="exposure"></output></span>
          <input type="range" data-setting="exposure" min="0.2" max="3" step="0.05" />
        </label>
        <label class="setting setting-inline">
          <input type="checkbox" data-setting="shadows" />
          <span>Stíny</span>
        </label>
        <label class="setting setting-inline">
          <input type="color" data-setting="background" />
          <span>Barva pozadí</span>
        </label>

        <h2>Rozklad</h2>
        <div class="setting-radio-group" role="radiogroup" aria-label="Režim rozkladu">
          <label class="setting-radio">
            <input type="radio" name="explodeMode" data-setting="explodeMode" value="auto" />
            <span>Automaticky</span>
          </label>
          <label class="setting-radio">
            <input type="radio" name="explodeMode" data-setting="explodeMode" value="manual" />
            <span>Vybrat jednotlivě</span>
          </label>
        </div>

        <label id="explode-auto-controls" class="setting">
          <span>Míra rozkladu <output data-for="explode"></output></span>
          <input type="range" data-setting="explode" min="0" max="1" step="0.01" />
        </label>

        <div id="explode-manual-controls" class="explode-pick-panel hidden">
          <p id="explode-pick-hint" class="setting-note">Klikněte na díl v modelu.</p>
          <div id="explode-pick-selected" class="hidden">
            <p class="setting-note">Vybráno: <strong id="explode-pick-name"></strong></p>
            <button id="explode-pick-reset" type="button">Vrátit tento díl na 0</button>
          </div>
        </div>

        <button id="explode-clear-btn" type="button">Zrušit celý rozklad</button>

        <h2>Textury</h2>
        <label class="setting setting-inline">
          <input type="checkbox" data-setting="fixUV" />
          <span>Opravit UV (box projekce)</span>
        </label>
        <label class="setting">
          <span>Měřítko textury <output data-for="uvScale"></output></span>
          <input type="range" data-setting="uvScale" min="0.1" max="5" step="0.1" />
        </label>
        <p id="uv-info" class="setting-note"></p>

        <button id="settings-reset" type="button">Výchozí nastavení</button>
      </aside>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span id="loading-text">Načítání modelu…</span>
      </div>

      <div id="error-box" class="error-box hidden"></div>

      <div id="part-tooltip" class="part-tooltip hidden">
        <span id="part-tooltip-name"></span>
        <button id="part-tooltip-select" type="button">Vybrat objekt</button>
      </div>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    // ---------- DOM ----------
    const canvas = document.getElementById("viewer-canvas");
    const container = document.getElementById("viewer-container");
    const dropzone = document.getElementById("dropzone");
    const modelSelect = document.getElementById("model-select");
    const resetBtn = document.getElementById("reset-btn");
    const settingsBtn = document.getElementById("settings-btn");
    const settingsPanel = document.getElementById("settings-panel");
    const settingsResetBtn = document.getElementById("settings-reset");
    const explodeAutoControls = document.getElementById("explode-auto-controls");
    const explodeManualControls = document.getElementById("explode-manual-controls");
    const explodePickHint = document.getElementById("explode-pick-hint");
    const explodePickSelected = document.getElementById("explode-pick-selected");
    const explodePickName = document.getElementById("explode-pick-name");
    const explodePickReset = document.getElementById("explode-pick-reset");
    const partTooltip = document.getElementById("part-tooltip");
    const partTooltipName = document.getElementById("part-tooltip-name");
    const partTooltipSelect = document.getElementById("part-tooltip-select");
    const explodeClearBtn = document.getElementById("explode-clear-btn");
    const uvInfo = document.getElementById("uv-info");
    const statusText = document.getElementById("status-text");
    const loadingEl = document.getElementById("loading");
    const loadingText = document.getElementById("loading-text");
    const errorBox = document.getElementById("error-box");

    // ---------- Settings ----------
    const SETTINGS_KEY = "glb-viewer-settings-v1";
    const DEFAULT_SETTINGS = {
      displayMode: "edges", // "solid" | "edges" | "wireframe"
      sunIntensity: 2.2,
      sunAzimuth: 45,
      sunElevation: 35,
      envIntensity: 0.35,
      exposure: 0.85,
      shadows: true,
      background: "#14161a",
      fixUV: true,
      uvScale: 1.0,
      explodeMode: "auto", // "auto" | "manual"
      explode: 0,
    };

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        return { ...DEFAULT_SETTINGS, ...saved };
      } catch {
        return { ...DEFAULT_SETTINGS };
      }
    }

    function saveSettings() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      } catch {
        // Storage unavailable (private window etc.) — settings just won't persist.
      }
    }

    const settings = loadSettings();

    // ---------- Three.js setup ----------
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      50,
      container.clientWidth / container.clientHeight,
      0.01,
      5000
    );
    camera.position.set(2, 2, 3);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // Lighting — a neutral studio environment gives PBR materials something
    // to reflect, plus one adjustable sun for shape and shadows.
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);
    scene.add(dirLight.target);

    // ---------- Loaders ----------
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath("https://unpkg.com/three@0.169.0/examples/jsm/libs/draco/");
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    // ---------- State ----------
    let currentModel = null;
    let defaultView = null; // { position: Vector3, target: Vector3 }
    const modelCenter = new THREE.Vector3();
    let modelRadius = 5;

    function setStatus(text) {
      statusText.textContent = text;
    }

    function showLoading(show, text) {
      loadingEl.classList.toggle("hidden", !show);
      if (text) loadingText.textContent = text;
    }

    function showError(message) {
      if (!message) {
        errorBox.classList.add("hidden");
        errorBox.textContent = "";
        return;
      }
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
      setTimeout(() => errorBox.classList.add("hidden"), 6000);
    }

    function disposeMaterial(m) {
      Object.values(m).forEach((v) => {
        if (v && v.isTexture) v.dispose();
      });
      m.dispose();
    }

    function clearCurrentModel() {
      if (currentModel) {
        selectedPart = null; // avoid touching a mesh whose material is about to be disposed
        gizmoGroup.visible = false;
        hideTooltip();
        if (dragState) {
          controls.enabled = true;
          dragState = null;
        }
        scene.remove(currentModel);
        currentModel.traverse((obj) => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.userData.originalGeometry) obj.userData.originalGeometry.dispose();
          if (obj.userData.edgeLines) {
            // EDGE_MATERIAL is shared across all meshes — dispose only its geometry.
            obj.userData.edgeLines.geometry.dispose();
          }
          if (obj.material) {
            const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
            materials.forEach(disposeMaterial);
          }
        });
        currentModel = null;
      }
    }

    // ---------- Display mode (solid / edges / wireframe) ----------
    const EDGE_MATERIAL = new THREE.LineBasicMaterial({ color: 0x0a0a0c });
    const EDGE_THRESHOLD_DEG = 20;

    function buildEdgeLines(mesh) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, EDGE_THRESHOLD_DEG);
      const lines = new THREE.LineSegments(edges, EDGE_MATERIAL);
      lines.renderOrder = 1;
      // A sibling of the mesh (not its child): a mesh hidden for wireframe
      // mode would otherwise hide its child lines too, since Three.js
      // skips rendering the whole subtree of an invisible object.
      lines.position.copy(mesh.position);
      lines.quaternion.copy(mesh.quaternion);
      lines.scale.copy(mesh.scale);
      mesh.parent.add(lines);
      mesh.userData.edgeLines = lines;
    }

    function applyDisplayMode() {
      if (!currentModel) return;
      const mode = settings.displayMode;
      currentModel.traverse((obj) => {
        if (!obj.isMesh) return;
        obj.visible = mode !== "wireframe";
        if (obj.userData.edgeLines) {
          obj.userData.edgeLines.visible = mode === "edges" || mode === "wireframe";
        }
      });
    }

    // ---------- Exploded view ----------
    // Two modes:
    //  - "auto": every part pushed away from a common center, radially, by
    //    one slider — a quick overview, not meant to be precise.
    //  - "manual": pick a part by clicking it, then drag one of 6 on-screen
    //    arrows (a 3D gizmo, like Blender/SketchUp) to nudge it along a
    //    single world axis. Full control, one part at a time.
    // Two earlier attempts at a single "smart" automatic layout (one shared
    // axis, then two axes picked by variance) were both hard to predict —
    // the direction a part would move wasn't obvious before trying it. The
    // gizmo replaces guessing with direct manipulation.
    const EXPLODE_FACTOR = 0.8;
    const MIN_EXPLODE_MAGNITUDE = 0.25;
    const AXES = [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)];

    function computeExplodeDirections(model) {
      // A "part" is any direct child of the model, mesh or group — a group
      // (e.g. a multi-piece sub-assembly like a roof drain, several nested
      // meshes under one node) explodes as a single rigid block rather than
      // falling apart internally, and simply gets skipped if it has no
      // mesh in it at all (empty helper nodes). Edge-line objects are NOT
      // parts of their own — buildEdgeLines() already added them as
      // siblings of their mesh in this same children list, and they're
      // synced to their owning mesh's position below. Counting them here
      // too would give them their own independent basePosition/offset, and
      // applyExplode() would then fight between the two — the edges
      // sliding one way while the mesh they belong to stays put.
      const parts = model.children.filter(
        (p) => !p.isLineSegments && new THREE.Box3().setFromObject(p).isEmpty() === false
      );
      const partCenters = parts.map((p) => new THREE.Box3().setFromObject(p).getCenter(new THREE.Vector3()));

      // The explosion center is the average of each part's own center, not
      // the bounding-box center of the whole model — a model dominated by
      // one large flat part (e.g. a floor slab) would otherwise put the
      // model's bounding-box center almost inside that part, leaving it
      // with almost no distance to move while smaller parts fly far away.
      const avgCenter = new THREE.Vector3();
      partCenters.forEach((c) => avgCenter.add(c));
      avgCenter.divideScalar(partCenters.length || 1);

      let maxDist = 1e-6;
      const dirs = partCenters.map((c) => {
        const dir = c.clone().sub(avgCenter);
        maxDist = Math.max(maxDist, dir.length());
        return dir;
      });

      parts.forEach((part, i) => {
        part.userData.basePosition = part.position.clone();
        const dist = dirs[i].length();
        const dir = dist > 1e-6 ? dirs[i].clone().divideScalar(dist) : new THREE.Vector3();
        const raw = dist / maxDist;
        // Guarantee every part moves a visible amount even if it sits
        // almost exactly at the center — without this, small parts near
        // the middle (e.g. bolts/anchors) look like they "don't work"
        // while parts near the edges fly far away.
        const magnitude = raw === 0 ? 0 : MIN_EXPLODE_MAGNITUDE + raw * (1 - MIN_EXPLODE_MAGNITUDE);
        part.userData.autoOffset = dir.multiplyScalar(magnitude);
        if (!part.userData.manualOffset) part.userData.manualOffset = new THREE.Vector3();
      });
    }

    function applyExplode() {
      if (!currentModel) return;
      const auto = settings.explodeMode === "auto";
      for (const part of currentModel.children) {
        if (!part.userData.basePosition) continue;
        const offset = auto
          ? part.userData.autoOffset.clone().multiplyScalar(settings.explode * modelRadius * EXPLODE_FACTOR)
          : part.userData.manualOffset.clone();
        part.position.copy(part.userData.basePosition).add(offset);
        if (part.userData.edgeLines) {
          part.userData.edgeLines.position.copy(part.position);
        }
      }
      if (gizmoGroup.visible) positionGizmo(selectedPart);
    }

    // ---------- Manual per-part explode: click a part, drag a 3D arrow ----------
    let selectedPart = null;
    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();

    function isManualMode() {
      return settings.explodeMode === "manual";
    }

    function setExplodeModeUI() {
      const auto = settings.explodeMode === "auto";
      explodeAutoControls.classList.toggle("hidden", !auto);
      explodeManualControls.classList.toggle("hidden", auto);
      canvas.classList.toggle("picking", !auto);
      if (auto) {
        selectPart(null);
        hideTooltip();
      }
    }

    function setPartHighlight(part, on) {
      if (!part) return;
      // part may be a group (a multi-mesh sub-assembly) — highlight every
      // mesh inside it, not just a direct material.
      part.traverse((obj) => {
        if (!obj.isMesh) return;
        const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
        materials.forEach((m) => {
          if (!m || !("emissive" in m)) return;
          if (on) m.emissive.setHex(0x3a6fe0);
          else m.emissive.setHex(0x000000);
        });
      });
    }

    // ---- 3D gizmo: 6 arrows (±X/±Y/±Z) drawn at the selected part ----
    const gizmoGroup = new THREE.Group();
    gizmoGroup.visible = false;
    scene.add(gizmoGroup);
    const GIZMO_AXES = [
      { axis: AXES[0], color: 0xdd4444, hoverColor: 0xff8080 },
      { axis: AXES[0].clone().negate(), color: 0xdd4444, hoverColor: 0xff8080 },
      { axis: AXES[1], color: 0x55bb55, hoverColor: 0x9dff9d },
      { axis: AXES[1].clone().negate(), color: 0x55bb55, hoverColor: 0x9dff9d },
      { axis: AXES[2], color: 0x4488ee, hoverColor: 0x9dc4ff },
      { axis: AXES[2].clone().negate(), color: 0x4488ee, hoverColor: 0x9dc4ff },
    ];

    const gizmoGrabMeshes = []; // parallel to gizmoGroup.children, used for raycasting

    function buildGizmo() {
      for (const spec of GIZMO_AXES) {
        const arrow = new THREE.ArrowHelper(spec.axis, new THREE.Vector3(), 1, spec.color, undefined, undefined);
        arrow.userData.axis = spec.axis;
        arrow.userData.color = spec.color;
        arrow.userData.hoverColor = spec.hoverColor;
        // A generous invisible cylinder around the visible arrow makes it
        // much easier to click/drag than the thin line+cone alone.
        // ArrowHelper points along its own local +Y (that's where its line
        // and cone children sit), so this needs no rotation of its own —
        // just extend along local Y like they do.
        const grabGeom = new THREE.CylinderGeometry(0.15, 0.15, 1, 8);
        grabGeom.translate(0, 0.5, 0);
        const grabMesh = new THREE.Mesh(grabGeom, new THREE.MeshBasicMaterial({ visible: false }));
        grabMesh.userData.arrow = arrow;
        arrow.add(grabMesh);
        gizmoGroup.add(arrow);
        gizmoGrabMeshes.push(grabMesh);
      }
    }
    buildGizmo();

    function positionGizmo(part) {
      const box = new THREE.Box3().setFromObject(part);
      const center = box.getCenter(new THREE.Vector3());
      // Scale to the selected part's own size, not the whole model's — a
      // small part (e.g. a bolt) needs small arrows, not ones sized for
      // the model overall.
      const size = box.getSize(new THREE.Vector3()).length() || modelRadius * 0.05;
      const length = THREE.MathUtils.clamp(size * 0.6, modelRadius * 0.02, modelRadius * 0.4);
      gizmoGroup.position.copy(center);
      gizmoGroup.children.forEach((arrow, i) => {
        arrow.setLength(length, length * 0.25, length * 0.15);
        // setLength() only scales ArrowHelper's own line/cone, not the
        // grab-cylinder child added in buildGizmo() — keep it in sync so
        // the clickable area matches what's actually drawn.
        gizmoGrabMeshes[i].scale.set(1, length, 1);
      });
    }

    function setGizmoHover(arrow, on) {
      if (!arrow) return;
      const color = on ? arrow.userData.hoverColor : arrow.userData.color;
      arrow.setColor(color);
    }

    function setGizmoVisible(on) {
      gizmoGroup.visible = on && !!selectedPart;
      if (gizmoGroup.visible) positionGizmo(selectedPart);
    }

    // A click on a part first shows a small tooltip bubble at the click
    // point (candidatePart) — only confirming it via the tooltip's "Vybrat
    // objekt" button actually selects the part and shows the gizmo. This
    // keeps the 3D view free of an unasked-for cross of arrows on every
    // click; the tooltip is the one deliberate step that turns them on.
    let candidatePart = null;

    function hideTooltip() {
      candidatePart = null;
      partTooltip.classList.add("hidden");
    }

    function showTooltipAt(part, clientX, clientY) {
      candidatePart = part;
      const rect = canvas.getBoundingClientRect();
      partTooltip.style.left = `${clientX - rect.left}px`;
      partTooltip.style.top = `${clientY - rect.top}px`;
      partTooltipName.textContent = part.name || "(bez názvu)";
      partTooltip.classList.remove("hidden");
    }

    function selectPart(part) {
      setPartHighlight(selectedPart, false);
      selectedPart = part;
      setPartHighlight(selectedPart, true);
      const has = !!part;
      explodePickHint.classList.toggle("hidden", has);
      explodePickSelected.classList.toggle("hidden", !has);
      setGizmoVisible(has);
      if (has) explodePickName.textContent = part.name || "(bez názvu)";
    }

    // Distinguish an actual click from the end of an OrbitControls drag
    // (rotate/pan) — both fire a "click" event on pointer-up.
    let pointerDownPos = null;
    canvas.addEventListener("pointerdown", (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    function ndcFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      return new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
    }

    canvas.addEventListener("click", (e) => {
      if (!isManualMode() || !currentModel || dragState) return;
      if (pointerDownPos) {
        const moved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (moved > 5) return; // was a drag, not a click
      }
      pointerNdc.copy(ndcFromEvent(e));
      raycaster.setFromCamera(pointerNdc, camera);
      // Recurse into groups (a part may be a multi-mesh sub-assembly like
      // TOPWET), then walk back up to whichever direct child of the model
      // was actually hit — that's the explode unit, not the leaf mesh.
      // Edge lines (LineSegments) are excluded: they're not real geometry
      // to click on, and a raycaster hit on one has no basePosition to
      // resolve to a part.
      const pickable = currentModel.children.filter((p) => !p.isLineSegments);
      const hits = raycaster.intersectObjects(pickable, true);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj.parent && obj.parent !== currentModel) obj = obj.parent;
        if (obj.userData.basePosition) showTooltipAt(obj, e.clientX, e.clientY);
      } else {
        hideTooltip();
      }
    });

    partTooltipSelect.addEventListener("click", () => {
      if (candidatePart) selectPart(candidatePart);
      hideTooltip();
    });

    explodePickReset.addEventListener("click", () => {
      if (!selectedPart) return;
      selectedPart.userData.manualOffset.set(0, 0, 0);
      applyExplode();
    });

    // ---- Dragging a gizmo arrow ----
    // While dragging, the part moves along a straight world-space line (the
    // arrow's axis, through the part's current position). The standard trick:
    // treat the mouse ray and the axis line as two 3D lines and find the
    // point on the axis closest to the mouse ray, using each pointermove.
    let dragState = null; // { part, axis, axisPoint, startOffset, startNdcPoint }

    function closestPointOnAxis(axisOrigin, axisDir, ray) {
      // Closest point between the axis line (origin + t*axisDir) and the
      // ray from the camera — standard closest-point-between-two-lines.
      const w0 = axisOrigin.clone().sub(ray.origin);
      const a = axisDir.dot(axisDir);
      const b = axisDir.dot(ray.direction);
      const c = ray.direction.dot(ray.direction);
      const d = axisDir.dot(w0);
      const e = ray.direction.dot(w0);
      const denom = a * c - b * b;
      if (Math.abs(denom) < 1e-9) return axisOrigin.clone();
      const t = (b * e - c * d) / denom;
      return axisOrigin.clone().addScaledVector(axisDir, t);
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (!isManualMode() || !selectedPart || !gizmoGroup.visible) return;
      pointerNdc.copy(ndcFromEvent(e));
      raycaster.setFromCamera(pointerNdc, camera);
      const hits = raycaster.intersectObjects(gizmoGrabMeshes, false);
      if (hits.length === 0) return;
      const arrow = hits[0].object.userData.arrow;
      const axisDir = arrow.userData.axis.clone();
      const axisOrigin = gizmoGroup.position.clone();
      const startPoint = closestPointOnAxis(axisOrigin, axisDir, raycaster.ray);
      dragState = {
        part: selectedPart,
        arrow,
        axisDir,
        axisOrigin,
        startPoint,
        startOffset: selectedPart.userData.manualOffset.clone(),
      };
      controls.enabled = false;
      setGizmoHover(arrow, true);
      e.stopPropagation();
    });

    window.addEventListener("pointermove", (e) => {
      if (!dragState) {
        // Hover feedback when not dragging.
        if (isManualMode() && gizmoGroup.visible && !dragStateJustEnded) {
          pointerNdc.copy(ndcFromEvent(e));
          raycaster.setFromCamera(pointerNdc, camera);
          const hits = raycaster.intersectObjects(gizmoGrabMeshes, false);
          gizmoGroup.children.forEach((a) => setGizmoHover(a, false));
          if (hits.length > 0) setGizmoHover(hits[0].object.userData.arrow, true);
        }
        return;
      }
      pointerNdc.copy(ndcFromEvent(e));
      raycaster.setFromCamera(pointerNdc, camera);
      const point = closestPointOnAxis(dragState.axisOrigin, dragState.axisDir, raycaster.ray);
      const delta = point.clone().sub(dragState.startPoint).dot(dragState.axisDir);
      dragState.part.userData.manualOffset
        .copy(dragState.startOffset)
        .addScaledVector(dragState.axisDir, delta);
      applyExplode();
    });

    let dragStateJustEnded = false;
    window.addEventListener("pointerup", () => {
      if (!dragState) return;
      setGizmoHover(dragState.arrow, false);
      dragState = null;
      controls.enabled = true;
      // Swallow the "click" that fires right after this pointerup so it
      // doesn't get misread as picking a different part.
      dragStateJustEnded = true;
      setTimeout(() => { dragStateJustEnded = false; }, 0);
    });

    explodeClearBtn.addEventListener("click", () => {
      settings.explode = 0;
      if (currentModel) {
        currentModel.children.forEach((part) => {
          if (part.userData.manualOffset) part.userData.manualOffset.set(0, 0, 0);
        });
      }
      // Also drop the current selection so the gizmo goes away and the
      // canvas goes back to plain orbit — "clear" should feel like a full
      // reset, not leave the view stuck in gizmo mode.
      selectPart(null);
      hideTooltip();
      syncSettingsUI();
      applyExplode();
      saveSettings();
    });

    // ---------- Lighting ----------
    function updateSun() {
      const az = THREE.MathUtils.degToRad(settings.sunAzimuth);
      const el = THREE.MathUtils.degToRad(settings.sunElevation);
      const dist = modelRadius * 2;
      dirLight.position.set(
        modelCenter.x + dist * Math.cos(el) * Math.cos(az),
        modelCenter.y + dist * Math.sin(el),
        modelCenter.z + dist * Math.cos(el) * Math.sin(az)
      );
      dirLight.target.position.copy(modelCenter);
      dirLight.intensity = settings.sunIntensity;

      // Fit the shadow camera tightly around the model for crisp shadows.
      const cam = dirLight.shadow.camera;
      cam.left = -modelRadius;
      cam.right = modelRadius;
      cam.top = modelRadius;
      cam.bottom = -modelRadius;
      cam.near = dist - modelRadius * 1.5;
      cam.far = dist + modelRadius * 1.5;
      cam.updateProjectionMatrix();
      dirLight.shadow.normalBias = modelRadius * 0.002;
      dirLight.castShadow = settings.shadows;
    }

    function applyLighting() {
      updateSun();
      scene.environmentIntensity = settings.envIntensity;
      renderer.toneMappingExposure = settings.exposure;
      scene.background = new THREE.Color(settings.background);
    }

    // ---------- UV repair (box projection) ----------
    // Blender materials mapped via Generated/Object/Box coordinates export
    // without usable UVs: glTF only carries UV maps. Such meshes either lack
    // a uv attribute or have faces collapsed to a line in UV space, which
    // shows up as streaks and noise. For those we project UVs from world space.
    const TEXTURE_SLOTS = ["map", "normalMap", "roughnessMap", "metalnessMap", "aoMap"];

    function hasTextures(mesh) {
      const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      return materials.some((m) => m && TEXTURE_SLOTS.some((slot) => m[slot]));
    }

    function hasBrokenUVs(geometry) {
      const uv = geometry.attributes.uv;
      if (!uv) return true;
      const pos = geometry.attributes.position;
      const index = geometry.index;
      const triCount = (index ? index.count : pos.count) / 3;
      const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
      const ua = new THREE.Vector2(), ub = new THREE.Vector2(), uc = new THREE.Vector2();
      let checked = 0;
      let collapsed = 0;
      for (let t = 0; t < triCount; t++) {
        const i0 = index ? index.getX(t * 3) : t * 3;
        const i1 = index ? index.getX(t * 3 + 1) : t * 3 + 1;
        const i2 = index ? index.getX(t * 3 + 2) : t * 3 + 2;
        a.fromBufferAttribute(pos, i0);
        b.fromBufferAttribute(pos, i1);
        c.fromBufferAttribute(pos, i2);
        const worldArea = b.sub(a).cross(c.sub(a)).length() / 2;
        if (worldArea < 1e-9) continue;
        ua.fromBufferAttribute(uv, i0);
        ub.fromBufferAttribute(uv, i1);
        uc.fromBufferAttribute(uv, i2);
        const uvArea = Math.abs((ub.x - ua.x) * (uc.y - ua.y) - (uc.x - ua.x) * (ub.y - ua.y)) / 2;
        checked++;
        if (uvArea / worldArea < 1e-6) collapsed++;
      }
      return checked > 0 && collapsed / checked > 0.2;
    }

    function buildBoxProjectedGeometry(mesh, scale) {
      const geometry = mesh.userData.originalGeometry.toNonIndexed();
      const pos = geometry.attributes.position;
      const uvs = new Float32Array(pos.count * 2);
      const w = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
      const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), n = new THREE.Vector3();

      for (let i = 0; i < pos.count; i += 3) {
        for (let k = 0; k < 3; k++) {
          w[k].fromBufferAttribute(pos, i + k).applyMatrix4(mesh.matrixWorld);
        }
        n.crossVectors(e1.subVectors(w[1], w[0]), e2.subVectors(w[2], w[0]));
        const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
        for (let k = 0; k < 3; k++) {
          let u, v;
          if (ax >= ay && ax >= az) { u = w[k].z; v = w[k].y; }
          else if (ay >= az) { u = w[k].x; v = w[k].z; }
          else { u = w[k].x; v = w[k].y; }
          uvs[(i + k) * 2] = u / scale;
          uvs[(i + k) * 2 + 1] = v / scale;
        }
      }
      geometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
      return geometry;
    }

    // Meshes judged broken on load; each keeps its original geometry in userData.
    let uvCandidates = [];

    function findUVCandidates(model) {
      uvCandidates = [];
      model.traverse((obj) => {
        if (obj.isMesh && hasTextures(obj) && hasBrokenUVs(obj.geometry)) {
          // Geometry may be shared between instances, so each mesh keeps its own reference.
          obj.userData.originalGeometry = obj.geometry;
          uvCandidates.push(obj);
        }
      });
    }

    function applyUVFix() {
      for (const mesh of uvCandidates) {
        const original = mesh.userData.originalGeometry;
        if (mesh.geometry !== original) mesh.geometry.dispose();
        mesh.geometry = settings.fixUV ? buildBoxProjectedGeometry(mesh, settings.uvScale) : original;
        // Geometry changed, so edge lines (built from the old geometry) must be rebuilt.
        // They're a sibling of the mesh, not its child — see buildEdgeLines().
        if (mesh.userData.edgeLines) {
          mesh.userData.edgeLines.geometry.dispose();
          mesh.parent.remove(mesh.userData.edgeLines);
          buildEdgeLines(mesh);
        }
      }
      applyDisplayMode();
      if (!currentModel) {
        uvInfo.textContent = "";
      } else if (uvCandidates.length === 0) {
        uvInfo.textContent = "Všechny objekty mají v pořádku UV.";
      } else {
        const names = uvCandidates.map((m) => m.name || "(bez názvu)").join(", ");
        uvInfo.textContent = settings.fixUV
          ? `Opraveno objektů: ${uvCandidates.length} (${names})`
          : `Objektů s chybnými UV: ${uvCandidates.length} (${names})`;
      }
    }

    // ---------- Camera framing ----------
    function frameObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;

      const size = box.getSize(new THREE.Vector3());
      box.getCenter(modelCenter);
      modelRadius = size.length() / 2 || 1;

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const fitOffset = 1.5;
      const fov = camera.fov * (Math.PI / 180);
      const distance = (maxDim / (2 * Math.tan(fov / 2))) * fitOffset;

      const direction = new THREE.Vector3(1, 0.6, 1).normalize();
      const newPos = modelCenter.clone().add(direction.multiplyScalar(distance));

      // Keep the near/far ratio modest — a huge range causes z-fighting flicker.
      camera.near = distance / 100;
      camera.far = distance * 100;
      camera.updateProjectionMatrix();

      camera.position.copy(newPos);
      controls.target.copy(modelCenter);
      controls.update();

      defaultView = { position: newPos.clone(), target: modelCenter.clone() };
    }

    function resetView() {
      if (!defaultView) return;
      camera.position.copy(defaultView.position);
      controls.target.copy(defaultView.target);
      controls.update();
    }

    // ---------- Loading ----------
    function onModelLoaded(gltf) {
      clearCurrentModel();
      currentModel = gltf.scene;

      // Blender exports its lights in physical units (a 1 W/m² sun becomes
      // 683 lux), which blows the scene out to white here. Use our own lighting.
      const embeddedLights = [];
      currentModel.traverse((obj) => { if (obj.isLight) embeddedLights.push(obj); });
      embeddedLights.forEach((light) => light.removeFromParent());

      currentModel.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });

      scene.add(currentModel);
      currentModel.updateMatrixWorld(true);
      findUVCandidates(currentModel);
      currentModel.traverse((obj) => { if (obj.isMesh) buildEdgeLines(obj); });
      applyUVFix(); // rebuilds edges for meshes whose geometry it replaces
      applyDisplayMode();
      frameObject(currentModel);
      computeExplodeDirections(currentModel); // needs modelCenter/modelRadius from frameObject
      applyExplode(); // respects a previously saved explode amount
      updateSun();
      dropzone.classList.add("hidden");
      showLoading(false);
    }

    function loadFromUrl(url, label, fileName) {
      showError(null);
      showLoading(true, `Načítání „${label}“…`);
      setStatus(label);
      gltfLoader.load(
        url,
        onModelLoaded,
        (xhr) => {
          if (xhr.total) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            showLoading(true, `Načítání „${label}“… ${pct}%`);
          }
        },
        (err) => {
          console.error(err);
          showLoading(false);
          const status = err && err.response && err.response.status;
          showError(
            status === 404 && fileName
              ? `Soubor models/${fileName} nebyl nalezen. Zkontrolujte, že je nahraný ve složce models/.`
              : "Nepodařilo se načíst model. Zkontrolujte, že jde o platný .glb/.gltf soubor."
          );
        }
      );
    }

    // ---------- Manifest / model select ----------
    function addPlaceholderOption(text) {
      const opt = document.createElement("option");
      opt.disabled = true;
      opt.textContent = text;
      modelSelect.appendChild(opt);
    }

    async function loadManifest() {
      // Browsers block fetch() on file:// pages, so the list only works when served.
      if (location.protocol === "file:") {
        addPlaceholderOption("Seznam funguje jen na webu (GitHub Pages / lokální server)");
        return;
      }
      try {
        const res = await fetch("models/manifest.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const list = await res.json();
        if (!Array.isArray(list)) throw new Error("manifest.json není pole");
        let added = 0;
        for (const entry of list) {
          if (!entry || !entry.file) continue;
          const opt = document.createElement("option");
          opt.value = entry.file;
          opt.textContent = entry.name || entry.file;
          modelSelect.appendChild(opt);
          added++;
        }
        if (added === 0) addPlaceholderOption("Zatím žádné modely v models/manifest.json");
      } catch (err) {
        console.warn("Nelze načíst models/manifest.json:", err);
        addPlaceholderOption("Seznam modelů se nepodařilo načíst");
      }
    }

    modelSelect.addEventListener("change", () => {
      const file = modelSelect.value;
      if (!file) return;
      // Cache-bust: browsers and the GitHub Pages CDN would otherwise keep
      // serving an old .glb after it's replaced under the same filename.
      loadFromUrl(`models/${file}?v=${Date.now()}`, modelSelect.options[modelSelect.selectedIndex].textContent, file);
    });

    resetBtn.addEventListener("click", resetView);

    // ---------- Settings panel ----------
    const settingInputs = settingsPanel.querySelectorAll("[data-setting]");

    function formatSetting(key, value) {
      if (key === "sunAzimuth" || key === "sunElevation") return `${Math.round(value)}°`;
      if (key === "uvScale") return `${Number(value).toFixed(1)} m`;
      if (key === "explode") return `${Math.round(value * 100)} %`;
      return Number(value).toFixed(2);
    }

    function syncSettingsUI() {
      settingInputs.forEach((input) => {
        const key = input.dataset.setting;
        if (input.type === "checkbox") input.checked = settings[key];
        else if (input.type === "radio") input.checked = input.value === settings[key];
        else input.value = settings[key];
        const out = settingsPanel.querySelector(`output[data-for="${key}"]`);
        if (out) out.textContent = formatSetting(key, settings[key]);
      });
    }

    settingInputs.forEach((input) => {
      input.addEventListener("input", () => {
        const key = input.dataset.setting;
        if (input.type === "checkbox") settings[key] = input.checked;
        else if (input.type === "range") settings[key] = Number(input.value);
        else settings[key] = input.value; // radio and other plain-value inputs
        syncSettingsUI();
        if (key === "fixUV" || key === "uvScale") applyUVFix();
        else if (key === "displayMode") applyDisplayMode();
        else if (key === "explode") applyExplode();
        else if (key === "explodeMode") { setExplodeModeUI(); applyExplode(); }
        else applyLighting();
        saveSettings();
      });
    });

    settingsResetBtn.addEventListener("click", () => {
      Object.assign(settings, DEFAULT_SETTINGS);
      syncSettingsUI();
      if (currentModel) {
        currentModel.children.forEach((part) => {
          if (part.userData.manualOffset) part.userData.manualOffset.set(0, 0, 0);
        });
      }
      setExplodeModeUI();
      applyLighting();
      applyUVFix();
      applyDisplayMode();
      applyExplode();
      saveSettings();
    });

    settingsBtn.addEventListener("click", () => {
      const open = settingsPanel.classList.toggle("hidden") === false;
      settingsBtn.setAttribute("aria-expanded", String(open));
    });

    // ---------- Resize ----------
    window.addEventListener("resize", () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // ---------- Render loop ----------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    syncSettingsUI();
    setExplodeModeUI();
    applyLighting();
    loadManifest();
    animate();
  </script>
</body>
</html>
